name: Update Lean
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  update_lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Update Lean project
        id: lean-update
        uses: Seasawher/lean-update@main
        with:
          update_if_modified: lean-toolchain

      - name: Install Nix
        if: steps.lean-update.outputs.result == 'update-success'
        uses: cachix/install-nix-action@v31

      - name: Update Nix flake
        if: steps.lean-update.outputs.result == 'update-success'
        run: |
          git fetch origin auto-update-lean/patch
          git checkout auto-update-lean/patch
          bash nix/update-hashes.sh
          nix flake update
          git add nix/toolchain-hashes.json flake.lock
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(nix): update toolchain hashes and flake.lock"
            git push
          fi
